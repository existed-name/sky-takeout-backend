server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info
        utils: info # debug

sky:
  # JwtProperties
  jwt:
    # 管理端 JWT
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${sky.jwt.admin-secret-key}
    # 设置jwt过期时间(ms)
    admin-ttl: 72000000 # 之前 7200000 = 120 * 60 * 1000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 用户端 JWT
    user-secret-key: ${sky.jwt.user-secret-key}
    user-ttl: 72000000
    user-token-name: authentication
  # 自己的微信小程序开发者信息
  wechat:
    # 小程序 id
    appid: ${sky.wechat.appid}
    # 小程序密钥
    secret: ${sky.wechat.secret}
  # 阿里 OSS 配置
  alioss:
    access-key-id: ${sky.alioss.access-key-id}
    bucket-name: ${sky.alioss.bucket-name}
    endpoint: ${sky.alioss.endpoint}
    access-key-secret: ${sky.alioss.access-key-secret}
  # 百度地图
  baidu-map:
    access-key: ${sky.baidu-map.access-key}
    # API 网址放在配置文件的目的是方便部署替换新网址
    url:
      # 地理编码 API, 把具体地址转为经纬度
      geocoding: ${sky.baidu-map.url.geocoding}
      # 路线规划 API, 主要用来拿到 2 个地址的路线距离
      direction: ${sky.baidu-map.url.direction}

pageHelper:
  # 自动修正非法页码（0、负数改为1，超过最大页改为最后一页）
  reasonable: true
  # 支持通过方法参数传递分页参数
  support-methods-arguments: true
  # 分页尺寸为0时查询所有记录（看需求开启）
  page-size-zero: false

